<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>q-graph</title>
<link rel="stylesheet" href="reactflow-base.css" id="rf-css">
<link rel="stylesheet" href="q-theme.css">
<style>
/* The q-graph live viewer. Tokens come from q-theme.css (generated from shared/ui). Kind colours (--q-k-*) mark
   graph kinds only; UI chrome and "running" use --q-accent. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--q-bg);color:var(--q-fg);font:14px/1.5 var(--q-sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--q-line);background:var(--q-surface)}
header h1{font:700 16px var(--q-mono);margin:0}
.live{font:600 12px var(--q-mono);color:var(--q-ok)}
.live.off{color:var(--q-bad)}
.counts{display:flex;gap:14px;font:12px var(--q-mono);color:var(--q-muted);margin-left:auto;flex-wrap:wrap}
.counts b{color:var(--q-fg);font-weight:700}
#app{flex:1;min-height:0;position:relative}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--q-muted);font:13px var(--q-mono);text-align:center;padding:24px}
.qn{background:var(--q-surface);border:1.6px solid var(--k);border-left-width:6px;border-radius:9px;padding:8px 12px;width:240px;color:var(--q-fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.qn .h{display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden}
.qn .h b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.qn .h span{font:10.5px var(--q-mono);color:var(--q-muted)}
.qn .h i{font:normal 10.5px var(--q-mono);color:var(--q-muted);margin-left:auto}
.qn .t{margin-top:1px;font:11.5px var(--q-sans);color:var(--q-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn .s{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font:600 11px var(--q-mono)}
.qn .s em{font-style:normal;font-weight:400;color:var(--q-muted);flex:none;white-space:nowrap}
.qn .s span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qn.pending{opacity:.5}
.qn.ask{background:var(--q-warn-soft);border-color:var(--q-warn)}
.qn.running{box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 20%,transparent)}
.qn.sel{outline:2px solid var(--k);outline-offset:3px}
.qt{background:color-mix(in srgb,var(--c) 10%,var(--q-surface));border:1.4px solid var(--c);border-radius:7px;padding:3px 9px;width:184px;font:600 11.5px var(--q-mono);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt small{font:400 10px var(--q-mono);opacity:.75;margin-right:6px;text-transform:uppercase;letter-spacing:.04em}
.qt.hot{background:var(--c);color:var(--q-surface)}
.qh{background:var(--q-sunken);border:1.4px dashed var(--q-muted);border-radius:9px;padding:8px 12px;width:300px;font:11.5px var(--q-mono);color:var(--q-fg)}
.qh b{display:block;font:600 13px var(--q-sans);margin-bottom:4px}
.qh b span{font:400 10.5px var(--q-mono);color:var(--q-muted);margin-left:8px}
.qh div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh i{font-style:normal;font-weight:700;color:var(--c)}
.react-flow__handle{opacity:0;pointer-events:none}
.react-flow__attribution{display:none}
.react-flow__controls{box-shadow:var(--q-shadow-1);border:1px solid var(--q-line);border-radius:var(--q-r-md);overflow:hidden}
.react-flow__controls-button{background:var(--q-surface);border-bottom-color:var(--q-line)}
.react-flow__controls-button:hover{background:var(--q-sunken)}
.react-flow__controls-button svg{fill:var(--q-fg)}
.react-flow__minimap{background:var(--q-surface);border:1px solid var(--q-line)}
.react-flow__minimap-mask{fill:color-mix(in srgb,var(--q-bg) 70%,transparent)}
.react-flow__edge.selected .react-flow__edge-path,.react-flow__edge:focus-visible .react-flow__edge-path{stroke:var(--q-accent)}
.react-flow__selection,.react-flow__nodesselection-rect{background:var(--q-accent-soft);border:1px dotted var(--q-accent-line)}
.qt.sel{outline:2px solid var(--c);outline-offset:2px}
/* The canvas and, while a node is selected, the detail sidebar on its right (a bottom sheet on narrow screens). */
.row{display:flex;height:100%}
.canvas{flex:1;min-width:0;min-height:0;position:relative}
.side{width:var(--side-w,360px);flex:none;position:relative;border-left:1px solid var(--q-line);background:var(--q-surface);display:flex;min-width:0}
.side .scroll{flex:1;min-width:0;overflow:auto;padding:12px 14px 24px;font:12px/1.5 var(--q-mono)}
/* Drag the left edge to resize; double-click it (or the ⤢ button) to toggle wide. */
.grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;touch-action:none}
.grip::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.grip:hover::after,.grip:focus-visible::after,.side.drag .grip::after{background:var(--q-accent)}
.grip:focus-visible{outline:none}
.side.drag{user-select:none}
/* Narrow screens: the sidebar is a bottom sheet that starts as a peek (⤢ makes it taller), no minimap, a one-line scrolling header. */
@media (max-width:760px){
  .row{flex-direction:column}
  .side{width:auto;height:35vh;max-height:35vh;display:block;overflow:auto;border-left:0;border-top:1px solid var(--q-line)}
  .side.tall{height:70vh;max-height:70vh}
  .grip{display:none}
  .react-flow__minimap{display:none}
  header{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:10px 14px}
  header>*{flex:none}
  .legend,.counts{flex-wrap:nowrap}
  .counts{margin-left:0}
}
.side .top{display:flex;align-items:flex-start;gap:8px}
.side .top b{font:600 15px var(--q-sans);flex:1;min-width:0;overflow-wrap:anywhere}
.side .x{all:unset;cursor:pointer;color:var(--q-muted);font:16px/1 var(--q-mono);padding:2px 6px;border-radius:5px}
.side .x:hover{background:var(--q-sunken);color:var(--q-fg)}
.side .x:focus-visible{outline:2px solid var(--q-accent)}
.side h3{font:600 10.5px var(--q-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--q-muted);margin:16px 0 6px}
.chip{display:inline-block;font:600 10.5px var(--q-mono);color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;margin-top:3px;background:color-mix(in srgb,var(--c) 10%,var(--q-surface));white-space:nowrap}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;margin-top:10px}
.kv>span{color:var(--q-muted)}
.kv>div{min-width:0;overflow-wrap:anywhere}
.lnk{all:unset;cursor:pointer;color:var(--c,var(--q-fg));overflow-wrap:anywhere}
.lnk:hover{text-decoration:underline}
.lnk:focus-visible,.bar:focus-visible,.call .r:focus-visible{outline:2px solid var(--q-accent);outline-offset:1px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:1px 0;overflow-wrap:anywhere}
.bar{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;padding:2px 4px;border-radius:5px}
.bar:hover,.bar.on{background:var(--q-sunken)}
.bar .l{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c)}
.bar .t{flex:1;height:7px;background:var(--q-sunken);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c);border-radius:4px}
.bar em{font-style:normal;color:var(--q-muted);min-width:28px;text-align:right}
.note{color:var(--q-muted);font-style:italic;margin:6px 0}
pre.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0;max-height:280px;overflow:auto;background:var(--q-sunken);border:1px solid var(--q-line);border-radius:6px;padding:6px 8px;font:11.5px/1.45 var(--q-mono)}
details.fold{margin-top:6px}
details.fold summary{cursor:pointer;color:var(--q-muted);font:600 10.5px var(--q-mono);text-transform:uppercase;letter-spacing:.06em}
details.fold.sec{margin:16px 0 0}
details.fold.sec[open]>summary{margin-bottom:6px}
/* Markdown preview of prompts and results: sanitized HTML, the raw text one click away. */
.mdwrap{position:relative;margin:4px 0}
.mdwrap .mode{position:absolute;top:4px;right:6px;z-index:1;display:inline-flex;overflow:hidden;font:600 10px var(--q-mono);background:var(--q-surface);border:1px solid var(--q-line);border-radius:4px}
.mdwrap .mode button{all:unset;cursor:pointer;color:var(--q-muted);padding:0 6px}
.mdwrap .mode button+button{border-left:1px solid var(--q-line)}
.mdwrap .mode button:hover{color:var(--q-fg)}
.mdwrap .mode button[aria-pressed="true"]{background:var(--q-fg);color:var(--q-surface);cursor:default}
.mdwrap .mode button:focus-visible{outline:2px solid var(--q-accent);outline-offset:-2px}
.mdwrap pre.txt{margin:0;padding-right:76px}
.md{max-height:420px;overflow:auto;background:var(--q-sunken);border:1px solid var(--q-line);border-radius:6px;padding:6px 76px 6px 10px;font:13px/1.55 var(--q-sans);overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font:600 13.5px/1.35 var(--q-sans);margin:12px 0 4px;color:var(--q-fg);text-transform:none;letter-spacing:0}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3{font-size:14px}
.md p,.md ul,.md ol,.md blockquote,.md table,.md pre{margin:6px 0}
.md ul,.md ol{padding-left:20px}
.md li{margin:1px 0}
.md code{font:11.5px var(--q-mono);background:var(--q-surface);border:1px solid var(--q-line);border-radius:4px;padding:0 4px}
.md pre{background:var(--q-surface);border:1px solid var(--q-line);border-radius:5px;padding:6px 8px;overflow:auto;white-space:pre}
.md pre code{border:0;padding:0;background:none}
.md blockquote{border-left:3px solid var(--q-line);padding-left:10px;color:var(--q-muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:12px}
.md th,.md td{border:1px solid var(--q-line);padding:2px 6px;text-align:left}
.md th{background:var(--q-surface)}
.md a{color:var(--q-accent)}
.md hr{border:0;border-top:1px solid var(--q-line);margin:10px 0}
.md img{max-width:100%}
.side .x[aria-pressed="true"].pin{color:var(--q-accent)}
.call{border-top:1px solid var(--q-line)}
.call .r{display:flex;gap:8px;align-items:baseline;padding:4px 2px;cursor:pointer}
.call .r:hover{background:var(--q-sunken)}
.call .r .tm{color:var(--q-muted);flex:none}
.call .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .r .n small{color:var(--q-muted);margin-left:6px;font-size:11px}
.call .r .d{color:var(--q-muted);flex:none}
.call .r .go{all:unset;cursor:pointer;flex:none;color:var(--c,var(--q-accent));font-size:11px}
.call .r .go:hover{text-decoration:underline}
.call .r .go:focus-visible{outline:2px solid var(--q-accent);outline-offset:1px}
.spawned{margin:4px 0;color:var(--q-muted)}
.call .body{padding:0 2px 8px}
.call .body h4{margin:6px 0 0;font:600 10px var(--q-mono);color:var(--q-muted);text-transform:uppercase;letter-spacing:.06em}
.ok{color:var(--q-ok)} .bad{color:var(--q-bad)} .run{color:var(--q-accent)}
.legend{display:flex;gap:12px;font:11px var(--q-mono);color:var(--q-muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.call.focus>.r{background:color-mix(in srgb,var(--q-accent) 12%,transparent)}
/* Graph | Timeline switch in the header. */
.seg{display:inline-flex;border:1px solid var(--q-line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font:600 12px var(--q-mono);padding:3px 10px;color:var(--q-muted)}
.seg button+button{border-left:1px solid var(--q-line)}
.seg button[aria-pressed="true"]{background:var(--q-fg);color:var(--q-surface)}
.seg button:focus-visible{outline:2px solid var(--q-accent);outline-offset:-2px}
/* Timeline: a toolbar, then one scroller holding a sticky axis row and sticky lane labels. */
.tl{display:flex;flex-direction:column;height:100%}
.tl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;border-bottom:1px solid var(--q-line);background:var(--q-surface);font:12px var(--q-mono)}
.tl-bar button{all:unset;cursor:pointer;border:1px solid var(--q-line);border-radius:6px;padding:1px 9px;font:600 12px var(--q-mono);color:var(--q-fg);background:var(--q-surface)}
.tl-bar button:hover{background:var(--q-sunken)}
.tl-bar button[aria-pressed="true"]{background:color-mix(in srgb,var(--q-accent) 14%,var(--q-surface));border-color:var(--q-accent);color:var(--q-accent)}
.tl-bar button:focus-visible{outline:2px solid var(--q-accent)}
.tl-bar .info{color:var(--q-muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.tl-axis{position:sticky;top:0;z-index:4;display:flex;height:26px;background:var(--q-surface);border-bottom:1px solid var(--q-line)}
.tl-corner{position:sticky;left:0;z-index:5;flex:none;background:var(--q-surface);border-right:1px solid var(--q-line);font:600 10.5px var(--q-mono);color:var(--q-muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px}
.tl-ticks{position:relative;flex:none;height:100%;overflow:hidden}
.tl-tick{position:absolute;bottom:0;height:7px;border-left:1px solid var(--q-muted)}
.tl-tick span{position:absolute;bottom:7px;left:3px;font:10.5px var(--q-mono);color:var(--q-muted);white-space:nowrap}
.tl-brklab{position:absolute;top:0;bottom:0;display:grid;place-items:center;cursor:help;font:10px var(--q-mono);color:var(--q-muted);white-space:nowrap;overflow:visible}
.tl-body{display:flex;position:relative}
.tl-labels{position:sticky;left:0;z-index:3;flex:none;background:var(--q-surface);border-right:1px solid var(--q-line)}
.tl-lab{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:3px 8px;border-bottom:1px solid var(--q-line);overflow:hidden}
.tl-lab:hover{background:var(--q-sunken)}
.tl-lab.on{background:color-mix(in srgb,var(--k) 14%,var(--q-surface));box-shadow:inset 3px 0 0 var(--k)}
.tl-lab:focus-visible{outline:2px solid var(--q-accent);outline-offset:-2px}
.tl-lab b{display:block;font:600 12.5px/1.3 var(--q-sans);color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab small{display:block;font:10.5px/1.3 var(--q-mono);color:var(--q-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-canvas{position:relative;z-index:0;flex:none;overflow:hidden}
.tl-row{position:absolute;left:0;right:0;border-bottom:1px solid var(--q-line)}
.tl-row.on{background:color-mix(in srgb,var(--k) 7%,transparent)}
.tl-life{position:absolute;height:3px;border-radius:2px;background:var(--k);opacity:.55}
.tl-brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--q-muted) 18%,transparent) 0 3px,transparent 3px 7px);border-left:1px dashed var(--q-line);border-right:1px dashed var(--q-line);z-index:1;pointer-events:none}
.tb{position:absolute;height:12px;border-radius:3px;background:var(--c);cursor:pointer;z-index:2}
.tb:hover{filter:brightness(1.15);z-index:3}
.tb.err{box-shadow:0 0 0 1.5px var(--q-bad);background:color-mix(in srgb,var(--c) 55%,var(--q-surface))}
.tb.run{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);background-size:11.3px 11.3px;animation:tlrun 1s linear infinite}
.tb.hit{outline:1px solid var(--q-fg);outline-offset:1px}
.tb.sel{outline:2.5px solid var(--q-accent);outline-offset:2px;z-index:4}
@keyframes tlrun{to{background-position:11.3px 0}}
@media (prefers-reduced-motion: reduce){.tb.run{animation:none}}
.tl-prompt{position:absolute;width:9px;height:9px;margin-left:-4.5px;transform:rotate(45deg);background:var(--q-surface);border:1.5px solid var(--q-accent);z-index:3;cursor:help}
.tl-now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--q-ok);z-index:3;pointer-events:none}
.tl-links{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
.tl-tip{position:fixed;z-index:20;pointer-events:none;max-width:420px;background:var(--q-surface);border:1px solid var(--q-line);border-radius:6px;padding:5px 8px;font:11.5px/1.45 var(--q-mono);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tl-tip b{font-weight:600}
.tl-tip div{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>q-graph</h1>
  <span id="views"></span>
  <span class="live off" id="live">● connecting</span>
  <span class="legend"><span><i style="--c:var(--q-k-main)"></i>main</span><span><i style="--c:var(--q-k-sub)"></i>subagent</span><span><i style="--c:var(--q-k-team)"></i>teammate</span><span><i style="--c:var(--q-k-tool)"></i>tool</span><span><i style="--c:var(--q-k-skill)"></i>skill</span><span><i style="--c:var(--q-k-mcp)"></i>mcp</span><span><i style="--c:var(--q-k-rule)"></i>rule</span></span>
  <span class="counts" id="counts"></span>
</header>
<div id="app"><div class="empty">Waiting for the session's first snapshot…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js" integrity="sha384-lA1w00Vex5qXDv4/xYJO/e8SCjfdlNghbTP+s+2zl37rCEAC7trsSRpYrv/JQy5y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script>
(function () {
  const app = document.getElementById('app')
  if (!window.React || !window.ReactDOM || !window.ReactFlow) {
    app.innerHTML = '<div class="empty">Could not load React Flow from the CDN (cdnjs, jsDelivr). The viewer needs internet access for its scripts; the data stays on this machine.</div>'
    return
  }
  const h = React.createElement
  const RF = window.ReactFlow
  const token = new URLSearchParams(location.search).get('k') || ''

  const KIND = { main: '--q-k-main', subagent: '--q-k-sub', teammate: '--q-k-team' }
  const kvar = k => 'var(' + (KIND[k] || '--q-muted') + ')'
  const ASK = new Set(['AskUserQuestion', 'ExitPlanMode'])
  const GLOW_MS = 1200
  const STATUS = { pending: ['· starting', 'var(--q-muted)'], waiting: ['⏸ waiting', 'var(--q-muted)'], idle: ['○ idle', 'var(--q-muted)'], completed: ['✓ done', 'var(--q-ok)'], failed: ['✗ failed', 'var(--q-bad)'], killed: ['■ stopped', 'var(--q-muted)'], lost: ['? lost', 'var(--q-muted)'] }
  const fmtTok = n => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n || 0)))
  const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); if (s < 60) return s + 's'; const m = Math.floor(s / 60); return m < 60 ? m + 'm' + String(s % 60).padStart(2, '0') : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0') }
  const shortModel = m => ((/\b(opus|sonnet|haiku|fable)\b/i.exec(m || '') || [])[1] || (m || '').replace(/^claude-/, '').replace(/-\d{8}$/, '')).toLowerCase()
  const since = (a, now) => (a.startedAt > 0 ? fmtTime((a.endedAt ?? now) - a.startedAt) : '')

    const at = t => { let lo = 0, hi = out.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (out[m].t0 <= t) lo = m; else hi = m - 1 } return out[lo] }
    const X = t => {
      const sg = at(t)
      if (t <= sg.t0) return sg.x0 - ((sg.t0 - t) / 1000) * pps
      if (t >= sg.t1) return sg.x0 + sg.w + ((t - sg.t1) / 1000) * pps
      return sg.brk ? sg.x0 + ((t - sg.t0) / (sg.t1 - sg.t0)) * sg.w : sg.x0 + ((t - sg.t0) / 1000) * pps
    }
    const T = px => {
      let sg = out[0]
      for (const s of out) if (s.x0 <= px) sg = s
      if (sg.brk && px <= sg.x0 + sg.w) return sg.t0 + ((px - sg.x0) / sg.w) * (sg.t1 - sg.t0)
      return sg.t0 + ((px - sg.x0) / pps) * 1000
    }
    return { segs: out, width: end + PAD_R, X, T, pps }

  function Timeline({ model, liveIds, now, sel, focus, onPick, onSelect }) {

    const visW = Math.max(60, box.w - LW)
    const fitPps = React.useMemo(() => fitPpsOf(segs, Math.max(40, visW - PAD_L - PAD_R), sec), [segs, visW, sec])

    const pending = React.useRef(null), expect = React.useRef(null)

    const step = TICKS.find(s => (s / 1000) * scale.pps >= 84) || TICKS[TICKS.length - 1]
    let lastLab = -Infinity
    const fmtTick = tt => (step < 60000 ? clock(new Date(tt).toISOString()) : hhmm(tt))
    ss.forEach((sg, si) => {
      if (sg.brk || sg.x0 > hi || sg.x0 + sg.w < lo) return

        ticks.push(h('div', { key: 'r' + sg.t0, className: 'tl-tick', style: { left: sg.x0 } }, h('span', null, fmtTick(sg.t0))))

    const rows = [], blocks = [], marks = [], links = []
    model.lanes.forEach((l, li) => {

        l.s != null ? h('div', { className: 'tl-life', style: { top: 4, left: X(l.s), width: Math.max(2, X(live.has(l.id) ? t : l.e || l.s) - X(l.s)) } }) : null))

      })

    }
    const toggleCompress = () => setCompress(v => { savePref(GAP_KEY, v ? '0' : '1'); return !v })

        tb('Follow live', 'Keep now in view', () => setFollow(v => !v), follow),

        h('span', { className: 'info' }, model.lanes.length + ' agents (incl. main) · ' + model.calls + ' calls' + (model.truncated ? ' · ' + model.truncated + ' older not shown' : '') + (isLive ? ' · live' : ''))),

        h('div', { style: { width: fullW, minHeight: AXIS_H + H, position: 'relative' } },

            h('div', { className: 'tl-ticks', style: { width } }, ticks,
              breaks.map(s => { const txt = '⋯ ' + fmtGap(s.t1 - s.t0 + 2 * IDLE_PAD) + ' idle'; return h('div', { key: 'b' + s.t0, className: 'tl-brklab', title: txt, style: { left: s.x0, width: s.w } }, s.w >= 60 ? txt : '⋯') }))),
          h('div', { className: 'tl-body', style: { width: fullW } },
            h('div', { className: 'tl-labels', style: { width: LW } }, model.lanes.map(l => h('button', {

  function TimelineView({ model, ...rest }) {

  function ViewSwitch({ view, setView, working, setWorking, hidden }) {

  }

  function App() {
    const [snap, setSnap] = React.useState(null)
    const [now, setNow] = React.useState(Date.now())
    const [, setScheme] = React.useState(0)
    React.useEffect(() => {

      mq.addEventListener('change', bump)

    }, [])
    const [sel, setSelOnly] = React.useState(null)
    // focusCall: the call a timeline click asked the sidebar to open; `n` makes a repeat click scroll again.
    const [focus, setFocus] = React.useState(null)
    const nonce = React.useRef(0)
    const select = React.useCallback((id, callId) => { setSelOnly(id); setFocus(callId ? { id: callId, n: ++nonce.current } : null) }, [])
    const setSel = React.useCallback(id => select(id, null), [select])
    const [view, setViewOnly] = React.useState(() => (loadPref(VIEW_KEY, 'graph') === 'timeline' ? 'timeline' : 'graph'))
    const setView = v => { setViewOnly(v); savePref(VIEW_KEY, v); framed.current = false; if (v !== 'graph') rf.current = null }
    // Working filter (remembered in this browser): hide agents that are done or idle. Re-frame on toggle, as the tree changes shape.
    const [working, setWorkingOnly] = React.useState(() => loadPref(WORK_KEY, '0') === '1')
    const setWorking = on => { setWorkingOnly(on); savePref(WORK_KEY, on ? '1' : '0'); framed.current = false }
    const keep = React.useMemo(() => (snap && working ? workingIds(snap.graph) : null), [snap, working])
    const hidden = keep ? snap.graph.order.filter(id => snap.graph.agents[id]).length - keep.size : 0

    // Pinned (the default): with nothing selected the sidebar shows main instead of closing; kept per browser.
    const [pinned, setPinned] = React.useState(() => loadPref(PIN_KEY, '1') === '1')

    const shown = sel || (pinned ? 'main' : null)
    // × closes for real: it unpins, so the sidebar stays shut until a node is clicked or the pin is set again.
    const close = () => { setSel(null); if (pinned) togglePin() }
    const [sideW, setSideW] = React.useState(loadW)
    const resize = (w, dragging) => { setSideW(w); if (!dragging) saveW(w) }
    const moved = React.useRef(new Map())
    const [movedAny, setMovedAny] = React.useState(false)
    const tidy = () => {

      if (snap) { const { nodes: fresh } = build(snap.graph, now, moved.current, keep); const at = new Map(fresh.map(n => [n.id, n.position])); setNodes(prev => prev.map(n => (at.has(n.id) ? { ...n, position: at.get(n.id) } : n))) }
    }
    const rf = React.useRef(null), canvas = React.useRef(null), framed = React.useRef(false)
    const [ready, setReady] = React.useState(0)
    const [nodes, setNodes, onNodesChange] = RF.useNodesState([])
    const [edges, setEdges] = RF.useEdgesState([])

    React.useEffect(() => {
      const live = document.getElementById('live')
      const es = new EventSource('events?k=' + encodeURIComponent(token))
      es.onopen = () => { live.textContent = '● live'; live.className = 'live' }
      es.onerror = () => { live.textContent = '● reconnecting (is the session still open?)'; live.className = 'live off' }
      es.onmessage = ev => { try { setSnap(JSON.parse(ev.data)) } catch (e) { /* a torn write; the next one is whole */ } }
      // The server says this page changed on disk: load the new one (the view, sidebar width and options are kept in localStorage).
      es.addEventListener('reload', () => location.reload())
      const tick = setInterval(() => setNow(Date.now()), 300)
      const esc = e => { if (e.key === 'Escape') setSel(null) }
      window.addEventListener('keydown', esc)
      return () => { es.close(); clearInterval(tick); window.removeEventListener('keydown', esc) }
    }, [])

    React.useEffect(() => {
      if (!snap) return
      const built = build(snap.graph, now, moved.current, keep)
      // Keep React Flow's own node objects (measured size, drag state) and refresh only their data;
      // a node the person has not moved follows the layout as agents come and go. `sel` drives selection.
      setNodes(prev => {
        const old = new Map(prev.map(n => [n.id, n]))
        return built.nodes.map(n => {
          const was = old.get(n.id)
          if (!was) return { ...n, selected: n.id === shown }
          const position = moved.current.has(n.id) || was.dragging ? was.position : n.position
          return { ...was, data: n.data, position, parentNode: n.parentNode, selected: n.id === shown }
        })
      })
      setEdges(built.edges)
      // Every count includes main, so the header, the Timeline toolbar and the token total agree.
      const g = snap.graph, all = g.order.map(id => g.agents[id]).filter(Boolean)
      const count = s => all.filter(a => a.status === s).length
      const noTok = all.filter(a => !a.tokens && LIVE.has(a.status)).length
      document.getElementById('counts').innerHTML =
        '<span title="including main"><b>' + all.length + '</b> agents (incl. main)</span><span><b>' + count('running') + '</b> running</span><span><b>' + all.filter(needsYou).length + '</b> need you</span><span title="' + (noTok ? noTok + ' running agent(s) have not reported tokens yet' : 'all agents, main included') + '"><b>' + fmtTok(all.reduce((n, a) => n + (a.tokens || 0), 0)) + (noTok ? '+' : '') + '</b> tok</span>'
    }, [snap, now, shown, keep])

    // First view of the graph: top-left of the tree at a readable zoom (fit-view alone shrinks a tall tree to
    // 7px text). Fit the width, but never below FRAME_MIN or above 1; the rest is a pan away.
    React.useEffect(() => {
      if (view !== 'graph' || framed.current || !rf.current || !canvas.current || !nodes.length) return
      const raf = requestAnimationFrame(() => {
        const inst = rf.current, el = canvas.current
        if (!inst || !el || framed.current) return
        framed.current = true
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity
        for (const n of nodes) if (!n.parentNode) { x0 = Math.min(x0, n.position.x); y0 = Math.min(y0, n.position.y); x1 = Math.max(x1, n.position.x + (n.width || NODE_W[n.type] || 220)) }
        const zoom = Math.max(FRAME_MIN, Math.min(1, (el.clientWidth - 2 * FRAME_PAD) / (x1 - x0)))
        inst.setViewport({ x: FRAME_PAD - x0 * zoom, y: FRAME_PAD - y0 * zoom, zoom })
      })
      return () => cancelAnimationFrame(raf)
    }, [ready, nodes.length, view])

    // When the selection changes (the sidebar may have just narrowed the canvas), pan to the node only
    // if it is out of view; otherwise leave the view alone.
    React.useEffect(() => {
      if (!shown || view !== 'graph') return
      const raf = requestAnimationFrame(() => requestAnimationFrame(() => {
        const inst = rf.current, el = canvas.current, n = inst && inst.getNode(shown)
        if (!n || !el) return
        const { x, y, zoom } = inst.getViewport(), p = n.positionAbsolute || n.position, w = n.width || 0, ht = n.height || 0
        const left = p.x * zoom + x, top = p.y * zoom + y
        if (left >= 0 && top >= 0 && left + w * zoom <= el.clientWidth && top + ht * zoom <= el.clientHeight) return
        inst.setCenter(p.x + w / 2, p.y + ht / 2, { zoom, duration: 250 })
      }))
      return () => cancelAnimationFrame(raf)
    }, [shown, view])

    if (!snap) return h('div', { className: 'empty' }, 'Waiting for the session\'s first snapshot…')
    return h(LaneCtx.Provider, { value: lanes }, h('div', { className: 'row' },
      ReactDOM.createPortal(h(ViewSwitch, { view, setView, working, setWorking, hidden }), document.getElementById('views')),
      view === 'timeline' ? h('div', { className: 'canvas' }, h(MemoTimeline, { model: tl.model, liveIds: tl.liveIds, now: tl.liveIds ? now : 0, sel: shown, focus, onPick: pick, onSelect: setSel })) :
      h('div', { className: 'canvas', ref: canvas },
        h(RF.ReactFlow, {
          nodes, edges, nodeTypes, edgeTypes, minZoom: 0.2, maxZoom: 2,
          onInit: inst => { rf.current = inst; setReady(n => n + 1) },
          onNodesChange: changes => {
            for (const c of changes) if (c.type === 'position' && c.position && !c.id.startsWith('use:')) { moved.current.set(c.id, c.position); if (!movedAny) setMovedAny(true) }
            // Selection belongs to `sel`; React Flow's own select changes would fight it.
            onNodesChange(changes.filter(c => c.type !== 'select' && c.type !== 'remove'))
          },
          nodesDraggable: true, panOnDrag: true, zoomOnScroll: true, zoomOnPinch: true, selectNodesOnDrag: false,
          deleteKeyCode: null, selectionKeyCode: null, multiSelectionKeyCode: null,
          onNodeClick: (_, n) => setSel(n.id),
          onPaneClick: () => setSel(null),
          proOptions: { hideAttribution: true },
        },
          h(RF.Background, { gap: 22, size: 1.3, color: cssVar('--q-grid') }),
          h(RF.Controls, { showInteractive: false },
            // Tidy: drop every manual drag so all cards go back to the tree layout.
            h(RF.ControlButton, { title: 'Tidy layout: put moved cards back in the tree', 'aria-label': 'Tidy layout', disabled: !movedAny, onClick: tidy }, '⟲')),
          h(RF.MiniMap, { pannable: true, zoomable: true, nodeColor: n => cssVar(n.type === 'use' ? USE_TOKEN[n.data.u?.kind] : KIND[n.data.a?.kind]) || cssVar('--q-muted') }))),
      shown ? h(Sidebar, { snap, sel: shown, now, focus, onSelect: setSel, onClose: close, width: sideW, onResize: resize, pinned, togglePin }) : null))
  }
  const EMPTY_LANES = new Map()
  const FRAME_MIN = 0.9, FRAME_PAD = 16, NODE_W = { agent: 240, use: 184, harness: 300 }

  app.innerHTML = ''
  ReactDOM.createRoot(app).render(h(App))
})()
</script>
</body>
</html>
