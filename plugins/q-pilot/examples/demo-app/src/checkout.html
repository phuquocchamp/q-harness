<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout · Demo Shop</title></head>
<body>
  <main>
    <h1>Checkout</h1>
    <section aria-labelledby="summary-title">
      <h2 id="summary-title">Order summary</h2>
      <p>Coffee beans × 1</p>
      <p>Total: <span data-testid="total">€12.00</span></p>
    </section>
    <form id="pay">
      <label>Email <input type="email" name="email" required></label>
      <button type="submit">Place order</button>
    </form>
    <p role="status" id="status"></p>
  </main>
  <script>
    // Fake payment: no network, just a confirmation message.
    document.getElementById('pay').addEventListener('submit', (event) => {
      event.preventDefault()
      document.getElementById('status').textContent = 'Order confirmed'
    })
  </script>
</body>
</html>
